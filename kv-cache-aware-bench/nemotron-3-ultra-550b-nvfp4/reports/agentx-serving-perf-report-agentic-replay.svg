<svg aria-labelledby="chart-title-agentx-agentic-replay" aria-describedby="chart-desc-agentx-agentic-replay" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="-20 -20 608.0625 763" height="763" xmlns="http://www.w3.org/2000/svg" width="609" id="agentx-agentic-replay" style="background: rgb(255, 255, 255);"><title id="chart-title-agentx-agentic-replay">Why agentic sessions exercise prefix reuse, cache residency and load balancing</title><desc id="chart-desc-agentx-agentic-replay">A parent conversation repeats prefix P across turns separated by response completion and recorded delays. Two subagents can share P and execute in parallel. A joined parent continues after the required branches finish. AIPerf replays these dependencies and delays against the serving endpoint; cache hits are measured outcomes.</desc><style>#agentx-agentic-replay{font-family:DejaVu Sans,sans-serif;font-size:18px;fill:#162b45;}#agentx-agentic-replay .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#agentx-agentic-replay .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#agentx-agentic-replay .edge-thickness-normal{stroke-width:2px;}#agentx-agentic-replay .edge-thickness-thick{stroke-width:3.5px;}#agentx-agentic-replay .edge-pattern-solid{stroke-dasharray:0;}#agentx-agentic-replay .edge-pattern-dashed{stroke-dasharray:3;}#agentx-agentic-replay .edge-pattern-dotted{stroke-dasharray:2;}#agentx-agentic-replay .marker{fill:#52657a;stroke:#52657a;}#agentx-agentic-replay .marker.cross{stroke:#52657a;}#agentx-agentic-replay svg{font-family:DejaVu Sans,sans-serif;font-size:18px;}#agentx-agentic-replay .label{font-family:DejaVu Sans,sans-serif;color:#162b45;}#agentx-agentic-replay .cluster-label text{fill:rgb(8.5000000002, 5.7500000001, 0);}#agentx-agentic-replay .cluster-label span,#agentx-agentic-replay p{color:rgb(8.5000000002, 5.7500000001, 0);}#agentx-agentic-replay .label text,#agentx-agentic-replay span,#agentx-agentic-replay p{fill:#162b45;color:#162b45;}#agentx-agentic-replay .node rect,#agentx-agentic-replay .node circle,#agentx-agentic-replay .node ellipse,#agentx-agentic-replay .node polygon,#agentx-agentic-replay .node path{fill:#fff4dd;stroke:hsl(40.5882352941, 60%, 83.3333333333%);stroke-width:1px;}#agentx-agentic-replay .flowchart-label text{text-anchor:middle;}#agentx-agentic-replay .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#agentx-agentic-replay .node .label{text-align:center;}#agentx-agentic-replay .node.clickable{cursor:pointer;}#agentx-agentic-replay .arrowheadPath{fill:#000000;}#agentx-agentic-replay .edgePath .path{stroke:#52657a;stroke-width:2.0px;}#agentx-agentic-replay .flowchart-link{stroke:#52657a;fill:none;}#agentx-agentic-replay .edgeLabel{background-color:#ffffff;text-align:center;}#agentx-agentic-replay .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#agentx-agentic-replay .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#agentx-agentic-replay .cluster rect{fill:hsl(220.5882352941, 100%, 98.3333333333%);stroke:hsl(220.5882352941, 60%, 88.3333333333%);stroke-width:1px;}#agentx-agentic-replay .cluster text{fill:rgb(8.5000000002, 5.7500000001, 0);}#agentx-agentic-replay .cluster span,#agentx-agentic-replay p{color:rgb(8.5000000002, 5.7500000001, 0);}#agentx-agentic-replay div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:DejaVu Sans,sans-serif;font-size:12px;background:hsl(220.5882352941, 100%, 98.3333333333%);border:1px solid hsl(220.5882352941, 60%, 88.3333333333%);border-radius:2px;pointer-events:none;z-index:100;}#agentx-agentic-replay .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#162b45;}#agentx-agentic-replay :root{--mermaid-font-family:DejaVu Sans,sans-serif;}#agentx-agentic-replay .parent rect{fill:#e8f0fe!important;stroke:#2463b3!important;color:#163d72!important;stroke-width:1.5px!important;}#agentx-agentic-replay .parent polygon{fill:#e8f0fe!important;stroke:#2463b3!important;color:#163d72!important;stroke-width:1.5px!important;}#agentx-agentic-replay .parent ellipse{fill:#e8f0fe!important;stroke:#2463b3!important;color:#163d72!important;stroke-width:1.5px!important;}#agentx-agentic-replay .parent circle{fill:#e8f0fe!important;stroke:#2463b3!important;color:#163d72!important;stroke-width:1.5px!important;}#agentx-agentic-replay .parent path{fill:#e8f0fe!important;stroke:#2463b3!important;color:#163d72!important;stroke-width:1.5px!important;}#agentx-agentic-replay .parent tspan{fill:#163d72!important;}#agentx-agentic-replay .delay rect{fill:#fff1e8!important;stroke:#d65b29!important;color:#89401f!important;stroke-width:1.5px!important;}#agentx-agentic-replay .delay polygon{fill:#fff1e8!important;stroke:#d65b29!important;color:#89401f!important;stroke-width:1.5px!important;}#agentx-agentic-replay .delay ellipse{fill:#fff1e8!important;stroke:#d65b29!important;color:#89401f!important;stroke-width:1.5px!important;}#agentx-agentic-replay .delay circle{fill:#fff1e8!important;stroke:#d65b29!important;color:#89401f!important;stroke-width:1.5px!important;}#agentx-agentic-replay .delay path{fill:#fff1e8!important;stroke:#d65b29!important;color:#89401f!important;stroke-width:1.5px!important;}#agentx-agentic-replay .delay tspan{fill:#89401f!important;}#agentx-agentic-replay .child rect{fill:#e6f4ed!important;stroke:#16836b!important;color:#135e4c!important;stroke-width:1.5px!important;}#agentx-agentic-replay .child polygon{fill:#e6f4ed!important;stroke:#16836b!important;color:#135e4c!important;stroke-width:1.5px!important;}#agentx-agentic-replay .child ellipse{fill:#e6f4ed!important;stroke:#16836b!important;color:#135e4c!important;stroke-width:1.5px!important;}#agentx-agentic-replay .child circle{fill:#e6f4ed!important;stroke:#16836b!important;color:#135e4c!important;stroke-width:1.5px!important;}#agentx-agentic-replay .child path{fill:#e6f4ed!important;stroke:#16836b!important;color:#135e4c!important;stroke-width:1.5px!