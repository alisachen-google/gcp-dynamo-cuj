# MNNVL smoke test for GKE A4X Max (GB300 NVL72).
#
# Two nodes, 8 GPUs, one 1 GiB NCCL all-reduce over multi-node NVLink. The pods get an
# IMEX channel from the ComputeDomain, so NCCL can reach the other node's GPUs over NVLink.
#
# Run (see ../README.md, section 6.2):
#   sed "s/NODE_POOL/${NODE_POOL}/" mnnvl-nccl-smoke.yaml | kubectl apply -n ${NAMESPACE} -f -
#
# PASS: "MNNVL 1 ... cliqueSize 8" in every pod log and busbw well above 400 GB/s
#       (validated on 2026-10-26: 706-722 GB/s).
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: mnnvl-smoke
spec:
  numNodes: 2
  channel:
    resourceClaimTemplate:
      name: mnnvl-smoke-channel
---
apiVersion: v1
kind: Service
metadata:
  name: mnnvl-smoke
spec:
  clusterIP: None
  selector:
    job-name: mnnvl-smoke
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mnnvl-smoke
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      subdomain: mnnvl-smoke
      nodeSelector:
        cloud.google.com/gke-nodepool: NODE_POOL
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Exists, effect: NoSchedule}
      resourceClaims:
      - name: compute-domain-channel
        resourceClaimTemplateName: mnnvl-smoke-channel
      containers:
      - name: nccl
        image: lmsysorg/sglang:v0.5.19-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          cat > /tmp/allreduce.py <<'PY'
          import time, torch, torch.distributed as dist
          dist.init_process_group("nccl")
          rank, world = dist.get_rank(), dist.get_world_size()
          torch.cuda.set_device(rank % 4)
          x = torch.ones(256 * 1024 * 1024, device="cuda")  # 1 GiB fp32
          for _ in range(5):
              dist.all_reduce(x)
          torch.cuda.synchronize()
          iters = 20
          t0 = time.perf_counter()
          for _ in range(iters):
              dist.all_reduce(x)
          torch.cuda.synchronize()
          dt = (time.perf_counter() - t0) / iters
          busbw = 2 * (world - 1) / world * x.numel() * 4 / dt / 1e9
          if rank == 0:
              print(f"allreduce 1 GiB on {world} GPUs: {dt*1e3:.2f} ms, busbw {busbw:.0f} GB/s", flush=True)
          dist.barrier()
          print(f"rank {rank}: OK", flush=True)
          PY
          export NCCL_MNNVL_ENABLE=1 NCCL_CUMEM_ENABLE=1
          export NCCL_DEBUG=INFO NCCL_DEBUG_SUBSYS=INIT,NET
          export GLOO_SOCKET_IFNAME=eth0 NCCL_SOCKET_IFNAME=eth0
          python3 -m torch.distributed.run --nnodes=2 --nproc_per_node=4 \
            --node_rank=${JOB_COMPLETION_INDEX} \
            --master_addr=mnnvl-smoke-0.mnnvl-smoke --master_port=29500 \
            /tmp/allreduce.py > /tmp/nccl.log 2>&1
          RC=$?
          grep -E "MNNVL|NVLS|NET/|busbw|OK|WARN|Error" /tmp/nccl.log | grep -vE "Channel|comm 0x"
          [ $RC -eq 0 ] || tail -40 /tmp/nccl.log
          exit $RC
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        resources:
          limits:
            nvidia.com/gpu: 4
          claims:
          - name: compute-domain-channel
      volumes:
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 16Gi}
